<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>视频工作台</title><link rel="stylesheet" href="/style.css"></head><body>
<div class="app2">
<header class="topbar">
  <div class="brand">视频工作台<span>Windows 本机混剪 · AI 文案按需发送给所填服务商</span></div>
  <div class="top-actions"><span class="muted">商品</span><select id="prodSel" aria-label="选择商品"><option value="">（未选择商品）</option></select><input id="newName" placeholder="新商品名称" aria-label="新商品名称"><button class="primary" onclick="createProduct()">＋ 创建</button></div>
</header>
<div id="err" class="panel error" hidden></div>
<main class="stack">
  <div class="col">
    <section class="panel" id="secMaterials"></section>
    <section class="panel" id="secScript"></section>
  </div>
  <div class="col">
    <section class="panel" id="secQueue"></section>
    <section class="panel" id="secResults"></section>
  </div>
</main>
<footer class="foot">素材只读使用；成片固定 1080×1920 / 30fps / H.264；文件夹在整台 Win 机（含 NAS 共享）内任选，也可直接粘贴路径；成片与封面（如启用）一起存进输出文件夹。</footer>
</div>
<script src="/app.js"></script></body></html>
